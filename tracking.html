<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESL Event Tracking - Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .stat-card h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .stat-card .number {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
        }

        .search-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .search-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .search-input-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: stretch;
        }

        .search-buttons {
            display: flex;
            gap: 10px;
            align-items: stretch;
        }

        .search-input {
            flex: 1;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #4caf50;
            color: white;
        }

        .btn-success:hover {
            background: #45a049;
        }

        .btn-warning {
            background: #ff9800;
            color: white;
        }

        .btn-warning:hover {
            background: #e68900;
        }

        .btn-danger {
            background: #f44336;
            color: white;
        }

        .btn-danger:hover {
            background: #da190b;
        }

        .result-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: none;
        }

        .result-section.show {
            display: block;
        }

        .participant-info {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .participant-info h3 {
            color: #333;
            font-size: 24px;
            margin-bottom: 15px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .info-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
        }

        .info-item label {
            display: block;
            color: #666;
            font-size: 12px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .info-item .value {
            color: #333;
            font-size: 16px;
            font-weight: 600;
        }

        .checkin-section {
            margin-bottom: 25px;
        }

        .checkin-section h4 {
            color: #333;
            margin-bottom: 15px;
            font-size: 20px;
        }

        .checkin-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .status-indicator {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-indicator.checked-in {
            background: #d4edda;
            color: #155724;
        }

        .status-indicator.not-checked-in {
            background: #f8d7da;
            color: #721c24;
        }

        .workshop-section {
            margin-top: 25px;
        }

        .workshop-form {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            color: #333;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .form-select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .workshop-list {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
        }

        .workshop-item {
            background: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }

        .loading {
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .back-btn {
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .header {
                padding: 20px 15px;
                margin-bottom: 20px;
            }

            .header h1 {
                font-size: 24px;
                margin-bottom: 8px;
            }

            .header p {
                font-size: 14px;
            }

            .stats-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
                margin-bottom: 20px;
            }

            .stat-card {
                padding: 15px;
            }

            .stat-card h3 {
                font-size: 11px;
            }

            .stat-card .number {
                font-size: 28px;
            }

            .search-section {
                padding: 20px 15px;
                margin-bottom: 20px;
            }

            .search-section h2 {
                font-size: 20px;
                margin-bottom: 15px;
            }

            .search-input-container {
                flex-direction: column;
                gap: 10px;
                align-items: stretch;
            }

            .search-buttons {
                flex-direction: row;
                gap: 10px;
                width: 100%;
            }

            .search-buttons .btn {
                flex: 1;
            }

            .search-input {
                width: 100%;
                padding: 12px;
                font-size: 16px;
            }

            .btn {
                width: 100%;
                padding: 12px 20px;
                font-size: 15px;
            }

            .result-section {
                padding: 20px 15px;
            }

            .participant-info {
                padding: 15px;
                margin-bottom: 20px;
            }

            .participant-info h3 {
                font-size: 20px;
                margin-bottom: 12px;
            }

            .info-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .info-item {
                padding: 12px;
            }

            .info-item label {
                font-size: 11px;
            }

            .info-item .value {
                font-size: 15px;
            }

            .checkin-section h4 {
                font-size: 18px;
                margin-bottom: 12px;
            }

            .checkin-buttons {
                flex-direction: column;
                gap: 10px;
            }

            .workshop-section h4 {
                font-size: 18px;
            }

            .workshop-form {
                padding: 15px;
            }

            .form-group {
                margin-bottom: 12px;
            }

            .form-group label {
                font-size: 14px;
            }

            .form-select {
                padding: 10px;
                font-size: 15px;
            }

            .workshop-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
                padding: 12px;
            }

            .workshop-item strong {
                font-size: 15px;
            }

            .workshop-item div {
                font-size: 13px !important;
            }

            .alert {
                padding: 12px;
                font-size: 14px;
            }

            #qrScannerContainer > div {
                max-width: 100% !important;
            }
        }

        /* Additional mobile optimizations for smaller screens */
        @media (max-width: 480px) {
            body {
                padding: 8px;
            }

            .header {
                padding: 15px 12px;
            }

            .header h1 {
                font-size: 20px;
            }

            .header p {
                font-size: 13px;
            }

            .stats-container {
                gap: 8px;
            }

            .stat-card {
                padding: 12px 10px;
            }

            .stat-card h3 {
                font-size: 10px;
            }

            .stat-card .number {
                font-size: 24px;
            }

            .search-section,
            .result-section {
                padding: 15px 12px;
            }

            .search-section h2 {
                font-size: 18px;
            }

            .btn {
                padding: 10px 15px;
                font-size: 14px;
            }
        }

        /* Landscape mobile orientation */
        @media (max-width: 896px) and (orientation: landscape) {
            .stats-container {
                grid-template-columns: repeat(4, 1fr);
            }

            .info-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🎓 ESL Event Tracking System</h1>
            <p>Admin Panel for Attendance Management</p>
        </div>

        <div class="stats-container" id="statsContainer">
            <div class="stat-card">
                <h3>Total Registrations</h3>
                <div class="number" id="totalRegistrations">0</div>
            </div>
            <div class="stat-card">
                <h3>Checked In</h3>
                <div class="number" id="checkedIn">0</div>
            </div>
            <div class="stat-card">
                <h3>Breakfast</h3>
                <div class="number" id="breakfast">0</div>
            </div>
            <div class="stat-card">
                <h3>Lunch</h3>
                <div class="number" id="lunch">0</div>
            </div>
        </div>

        <div class="search-section">
            <h2>🔍 Lookup Participant</h2>
            <div class="search-input-container">
                <input type="text" class="search-input" id="searchInput"
                    placeholder="Enter QR Code or Registration Number (e.g., ESL-2025-0001)" autocomplete="off">
                <div class="search-buttons">
                    <button class="btn btn-primary" onclick="lookupParticipant()">Search</button>
                    <button class="btn btn-success" onclick="startQRScanner()">📷 Scan QR</button>
                </div>
            </div>

            <!-- QR Scanner Video Element (hidden by default) -->
            <div id="qrScannerContainer" style="display: none; margin-top: 20px;">
                <div style="max-width: 500px; margin: 0 auto;">
                    <div id="qrVideo" style="width: 100%;"></div>
                    <button class="btn btn-danger" onclick="stopQRScanner()" style="margin-top: 10px; width: 100%;">Stop
                        Scanner</button>
                </div>
            </div>

            <div id="alertContainer"></div>
        </div>

        <div class="result-section" id="resultSection">
            <button class="btn back-btn" onclick="resetSearch()">← Back to Search</button>

            <div class="participant-info">
                <h3 id="participantName"></h3>
                <div class="info-grid">
                    <div class="info-item">
                        <label>Registration Number</label>
                        <div class="value" id="regNumber"></div>
                    </div>
                    <div class="info-item">
                        <label>Email</label>
                        <div class="value" id="email"></div>
                    </div>
                    <div class="info-item">
                        <label>Phone</label>
                        <div class="value" id="phone"></div>
                    </div>
                    <div class="info-item">
                        <label>University</label>
                        <div class="value" id="university"></div>
                    </div>
                    <div class="info-item">
                        <label>City</label>
                        <div class="value" id="city"></div>
                    </div>
                    <div class="info-item">
                        <label>Organization</label>
                        <div class="value" id="organization"></div>
                    </div>
                </div>
            </div>

            <div class="checkin-section">
                <h4>📋 Check-In Status</h4>
                <div class="checkin-buttons">
                    <button class="btn btn-success" id="btnRegistration" onclick="checkIn('registration')">
                        Registration Check-In
                    </button>
                    <button class="btn btn-warning" id="btnBreakfast" onclick="checkIn('breakfast')">
                        Breakfast Check-In
                    </button>
                    <button class="btn btn-danger" id="btnLunch" onclick="checkIn('lunch')">
                        Lunch Check-In
                    </button>
                </div>
            </div>

            <div class="workshop-section">
                <h4>🎯 Workshop Attendance</h4>
                <div class="workshop-form">
                    <div class="form-group">
                        <label for="workshopName">Workshop Name</label>
                        <select class="form-select" id="workshopName">
                            <option value="">Select Workshop</option>
                            <option value="Navigating Conflicts: Turning Tension into Team Growth">Navigating Conflicts: Turning Tension into Team Growth</option>
                            <option value="Designing Impactful Community Projects: From Idea to Action">Designing Impactful Community Projects: From Idea to Action</option>
                            <option value="Lead the Clock: Managing Projects with Precision and Purpose">Lead the Clock: Managing Projects with Precision and Purpose</option>
                            <option value="Beyond the Year: Sustaining Clubs and Creating Legacy">Beyond the Year: Sustaining Clubs and Creating Legacy</option>
                            <option value="From Groups to Teams: Building Cooperation and Purpose">From Groups to Teams: Building Cooperation and Purpose</option>
                            <option value="From Student to Student: Your Path to Leadership Development">From Student to Student: Your Path to Leadership Development</option>
                            <option value="Mindful Leadership: Managing Stress and Building Emotionally Intelligent Teams">Mindful Leadership: Managing Stress and Building Emotionally Intelligent Teams</option>
                            <option value="Brand Yourself: Crafting a Leadership Identity for the Future">Brand Yourself: Crafting a Leadership Identity for the Future</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="workshopSession">Session</label>
                        <select class="form-select" id="workshopSession">
                            <option value="">Select Session</option>
                            <option value="Lead">Workshops – Lead</option>
                            <option value="Develop">Workshops – Develop</option>
                        </select>
                    </div>
                    <button class="btn btn-primary" onclick="checkInWorkshop()">Add Workshop Attendance</button>
                </div>

                <div class="workshop-list">
                    <h5 style="margin-bottom: 15px; color: #333;">Attended Workshops:</h5>
                    <div id="workshopList"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script>
        // Configuration - Update this with your backend URL
        const API_BASE_URL = 'https://api.aucsu.org/api/v1/admin/esl-tracking';

        let currentParticipant = null;
        let authToken = localStorage.getItem('authToken'); // Assuming token is stored in localStorage
        let html5QrCode = null;

        // Initialize page
        document.addEventListener('DOMContentLoaded', function () {
            loadStats();

            // Allow Enter key to search
            document.getElementById('searchInput').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    lookupParticipant();
                }
            });
        });

        // Load statistics
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE_URL}/stats`, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const result = await response.json();
                    const stats = result.data;

                    document.getElementById('totalRegistrations').textContent = stats.total_registrations;
                    document.getElementById('checkedIn').textContent = stats.checked_in_count;
                    document.getElementById('breakfast').textContent = stats.breakfast_count;
                    document.getElementById('lunch').textContent = stats.lunch_count;
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // Lookup participant
        async function lookupParticipant() {
            const code = document.getElementById('searchInput').value.trim();

            if (!code) {
                showAlert('Please enter a QR code or registration number', 'error');
                return;
            }

            showLoading();

            try {
                const response = await fetch(`${API_BASE_URL}/lookup/${encodeURIComponent(code)}`, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const result = await response.json();
                    currentParticipant = result.data;
                    displayParticipant(currentParticipant);
                    hideLoading();
                } else {
                    const error = await response.json();
                    hideLoading();
                    showAlert(error.message || 'Participant not found', 'error');
                }
            } catch (error) {
                hideLoading();
                showAlert('Error looking up participant: ' + error.message, 'error');
            }
        }

        // Display participant information
        function displayParticipant(participant) {
            document.getElementById('participantName').textContent =
                `${participant.first_name} ${participant.last_name}`;
            document.getElementById('regNumber').textContent = participant.registration_number;
            document.getElementById('email').textContent = participant.email;
            document.getElementById('phone').textContent = participant.phone;
            document.getElementById('university').textContent = participant.university;
            document.getElementById('city').textContent = participant.city;
            document.getElementById('organization').textContent = participant.organization || 'N/A';

            // Update button states
            updateButtonState('btnRegistration', participant.registration_checked_in);
            updateButtonState('btnBreakfast', participant.breakfast_checked_in);
            updateButtonState('btnLunch', participant.lunch_checked_in);

            // Display workshops
            displayWorkshops(participant.workshops || []);

            // Show result section
            document.getElementById('resultSection').classList.add('show');
        }

        // Update button state
        function updateButtonState(buttonId, isCheckedIn) {
            const button = document.getElementById(buttonId);

            // Get original button text (without checkmark)
            let originalText = button.textContent.replace(/\s*✓/g, '').trim();

            if (isCheckedIn) {
                button.disabled = true;
                button.innerHTML = originalText + ' ✓';
                button.style.opacity = '0.6';
            } else {
                button.disabled = false;
                button.innerHTML = originalText;
                button.style.opacity = '1';
            }
        }

        // Display workshops
        function displayWorkshops(workshops) {
            const container = document.getElementById('workshopList');

            if (workshops.length === 0) {
                container.innerHTML = '<p style="color: #666; text-align: center;">No workshops attended yet</p>';
                return;
            }

            container.innerHTML = workshops.map(workshop => `
                <div class="workshop-item">
                    <div>
                        <strong>${workshop.workshop_name}</strong>
                        <div style="color: #666; font-size: 14px;">${workshop.workshop_session || 'General'}</div>
                    </div>
                    <div style="color: #666; font-size: 14px;">
                        ${new Date(workshop.checked_in_at).toLocaleString()}
                    </div>
                </div>
            `).join('');
        }

        // Check in
        async function checkIn(type) {
            if (!currentParticipant) return;

            const checkedBy = 'Admin';

            try {
                const response = await fetch(`${API_BASE_URL}/checkin/${type}/${currentParticipant.qr_code}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ checked_by: checkedBy })
                });

                const result = await response.json();

                if (response.ok) {
                    showAlert(result.message, 'success');
                    // Refresh participant data and stats
                    await lookupParticipant();
                    await loadStats();
                } else {
                    showAlert(result.message || 'Check-in failed', 'error');
                }
            } catch (error) {
                showAlert('Error during check-in: ' + error.message, 'error');
            }
        }

        // Check in workshop
        async function checkInWorkshop() {
            if (!currentParticipant) return;

            const workshopName = document.getElementById('workshopName').value;
            const workshopSession = document.getElementById('workshopSession').value;

            if (!workshopName) {
                showAlert('Please select a workshop', 'warning');
                return;
            }

            if (!workshopSession) {
                showAlert('Please select a session', 'warning');
                return;
            }

            const checkedBy = 'Admin';

            try {
                const response = await fetch(`${API_BASE_URL}/checkin/workshop/${currentParticipant.qr_code}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        workshop_name: workshopName,
                        workshop_session: workshopSession,
                        checked_by: checkedBy
                    })
                });

                const result = await response.json();

                if (response.ok) {
                    showAlert(result.message, 'success');
                    // Reset form
                    document.getElementById('workshopName').value = '';
                    document.getElementById('workshopSession').value = '';
                    // Refresh participant data and stats
                    await lookupParticipant();
                    await loadStats();
                } else {
                    showAlert(result.message || 'Workshop check-in failed', 'error');
                }
            } catch (error) {
                showAlert('Error during workshop check-in: ' + error.message, 'error');
            }
        }

        // Show alert
        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            const alertClass = type === 'error' ? 'alert-error' :
                type === 'warning' ? 'alert-warning' : 'alert-success';

            container.innerHTML = `<div class="alert ${alertClass}">${message}</div>`;

            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }

        // Show/hide loading
        function showLoading() {
            const container = document.getElementById('alertContainer');
            container.innerHTML = '<div class="loading"><div class="spinner"></div><p>Searching...</p></div>';
        }

        function hideLoading() {
            const container = document.getElementById('alertContainer');
            container.innerHTML = '';
        }

        // Reset search
        function resetSearch() {
            document.getElementById('resultSection').classList.remove('show');
            document.getElementById('searchInput').value = '';
            currentParticipant = null;
        }

        // QR Code Scanner Functions
        async function startQRScanner() {
            const scannerContainer = document.getElementById('qrScannerContainer');

            // Show scanner container
            scannerContainer.style.display = 'block';

            try {
                // Initialize QR code scanner
                if (!html5QrCode) {
                    html5QrCode = new Html5Qrcode("qrVideo");
                }

                // Start scanning
                await html5QrCode.start(
                    { facingMode: "environment" }, // Use back camera
                    {
                        fps: 10,
                        qrbox: { width: 250, height: 250 }
                    },
                    onScanSuccess,
                    onScanFailure
                );

                showAlert('📷 Camera started. Point at QR code to scan.', 'success');
            } catch (err) {
                showAlert('❌ Failed to start camera: ' + err.message, 'error');
                scannerContainer.style.display = 'none';
            }
        }

        function onScanSuccess(decodedText, decodedResult) {
            // QR code detected!
            console.log(`QR Code detected: ${decodedText}`);

            // Stop scanner
            stopQRScanner();

            // Put the scanned code in search box
            document.getElementById('searchInput').value = decodedText.trim();

            // Automatically search
            lookupParticipant();

            showAlert(`QR Code scanned: ${decodedText}`, 'success');
        }

        function onScanFailure(error) {
            // This gets called constantly while scanning, so don't show errors
            // console.warn(`QR Code scan error: ${error}`);
        }

        async function stopQRScanner() {
            if (html5QrCode) {
                try {
                    await html5QrCode.stop();
                    html5QrCode.clear();
                    html5QrCode = null;
                } catch (err) {
                    console.error('Error stopping scanner:', err);
                }
            }
            document.getElementById('qrScannerContainer').style.display = 'none';
        }
    </script>
</body>

</html>
